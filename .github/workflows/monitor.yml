name: DC Monitor
on:
  schedule:
    - cron: '*/3 * * * *' # 每 3 分钟检查一次
  workflow_dispatch: 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          INVITE_CODE: "8Kz6A28AU" # 已经换成你开着的社区啦
        run: |
          python -c "
          import os, urllib.request, json
          
          code = os.environ['INVITE_CODE']
          token = os.environ['PUSHPLUS_TOKEN']
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始发微信')
                      title = '🚨🚨🚨 卧槽！开门啦！快冲！！！'
                      content = f'🔥🔥🔥 社区 {code} 开门了！\n\n🔗 链接：https://discord.gg/{code}\n\n🏃‍♂️💨 别犹豫了！！！赶紧带上魔法冲进去！！！'
                      
                      payload = {
                          'token': token,
                          'title': title,
                          'content': content,
                          'template': 'html'
                      }
                      data = json.dumps(payload).encode('utf-8')
                      push_req = urllib.request.Request('https://www.pushplus.plus/send', data=data, headers={'Content-Type': 'application/json'})
                      with urllib.request.urlopen(push_req, timeout=10) as push_resp:
                          print('微信发送成功！')
                  else:
                      print('还没开门。')
          except Exception as e:
              print('没开门或网络错误:', e)
          "
