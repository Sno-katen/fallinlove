name: DC Monitor
on:
  schedule:
    - cron: '*/3 * * * *' # 改成了每 3 分钟检查一次
  workflow_dispatch: 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_PASS: ${{ secrets.QQ_PASS }}
          INVITE_CODE: "puppyboo"
        run: |
          python -c "
          import os, urllib.request, smtplib
          from email.mime.text import MIMEText
          
          code = os.environ['INVITE_CODE']
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始发邮件')
                      content = f'🔥🔥🔥 卧槽！快醒醒！！！社区开门啦！！！ 🔥🔥🔥\n\n🎉 邀请码：{code}\n🔗 链接：https://discord.gg/{code}\n\n🏃‍♂️💨 别犹豫了！！！赶紧带上魔法冲进去！！！\n\n(这是云端机器人自动发的邮件，不要回复)'
                      msg = MIMEText(content, 'plain', 'utf-8')
                      msg['Subject'] = '🚨🚨🚨 紧急提醒！！！开门啦！！！快冲！！！ 🚨🚨🚨'
                      msg['From'] = os.environ['QQ_EMAIL']
                      msg['To'] = os.environ['QQ_EMAIL']
                      
                      server = smtplib.SMTP_SSL('smtp.qq.com', 465)
                      server.login(os.environ['QQ_EMAIL'], os.environ['QQ_PASS'])
                      server.sendmail(os.environ['QQ_EMAIL'], [os.environ['QQ_EMAIL']], msg.as_string())
                      server.quit()
                      print('邮件发送成功！')
                  else:
                      print('还没开门。')
          except Exception as e:
              print('没开门或网络错误:', e)
          "
