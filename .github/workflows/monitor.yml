name: DC Monitor
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          INVITE_CODE: "8Kz6A28AU"
        run: |
          python -c "
          import os, urllib.request, json
          
          code = os.environ['INVITE_CODE']
          spt = os.environ['WXPUSHER_SPT']
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始发微信...')
                      
                      payload = {
                          'spt': spt,
                          'content': f'🔥 社区 {code} 开门了！\n链接: https://discord.gg/{code}',
                          'summary': '🚨 社区开门啦！',
                          'contentType': 1
                      }
                      data = json.dumps(payload).encode('utf-8')
                      push_req = urllib.request.Request('https://wxpusher.zjiecode.com/api/send/message/simple-push', data=data, headers={'Content-Type': 'application/json'})
                      
                      with urllib.request.urlopen(push_req, timeout=10) as push_resp:
                          print('WxPusher 返回:', push_resp.read().decode('utf-8'))
                  else:
                      print('还没开门。')
          except Exception as e:
              print('网络错误或代码报错:', e)
          "
