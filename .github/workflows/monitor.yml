name: DC Monitor
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          INVITE_CODE: "puppyboo"
        run: |
          python -c "
          import os, urllib.request, json
          
          code = os.environ['INVITE_CODE']
          spt = os.environ['WXPUSHER_SPT']
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始发微信...')
                      
                      # 👇 这里已经改成了 wbz
                      content = f'🔥🔥🔥 wbz！快醒醒！！！社区开门啦！！！ 🔥🔥🔥\n\n🎉 邀请码：{code}\n🔗 链接：https://discord.gg/{code}\n\n🏃‍♂️💨 别犹豫了！！！赶紧带上魔法冲进去！！！'
                      
                      payload = {
                          'spt': spt,
                          'content': content,
                          'summary': '🚨🚨🚨 紧急提醒：wbz！开门啦！快冲！！！ 🚨🚨🚨',
                          'contentType': 1
                      }
                      data = json.dumps(payload).encode('utf-8')
                      push_req = urllib.request.Request('https://wxpusher.zjiecode.com/api/send/message/simple-push', data=data, headers={'Content-Type': 'application/json'})
                      
                      with urllib.request.urlopen(push_req, timeout=10) as push_resp:
                          print('WxPusher 返回:', push_resp.read().decode('utf-8'))
                  else:
                      print('还没开门。')
          except Exception as e:
              print('网络错误或代码报错:', e)
          "
