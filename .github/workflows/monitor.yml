name: DC Monitor
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 强制发微信测试
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          curl -X POST "https://www.pushplus.plus/send" \
          -H "Content-Type: application/json" \
          -d '{"token":"'"$PUSHPLUS_TOKEN"'","title":"测试成功！","content":"恭喜！你的微信通道已经完全打通啦！","template":"html"}'
