name: DC Monitor
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          INVITE_CODE: "8Kz6A28AU" # 现在是测试社区，测通了改回 puppyboo
        run: |
          python -c "
          import os, urllib.request, json
          
          code = os.environ['INVITE_CODE']
          spt = os.environ['WXPUSHER_SPT']
          
          # 查询 Discord 状态
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始发微信...')
                      
                      # 使用正确的极简推送 (SPT) 接口
                      push_url = f'https://wxpusher.zjiecode.com/api/send/message/{spt}'
                      payload = {
                          'content': f'🔥 社区 {code} 开门了！\n链接: https://discord.gg/{code}\n快冲！',
                          'summary': '🚨 社区开门啦！'
                      }
                      data = json.dumps(payload).encode('utf-8')
                      push_req = urllib.request.Request(push_url, data=data, headers={'Content-Type': 'application/json'})
                      
                      with urllib.request.urlopen(push_req, timeout=10) as push_resp:
                          # 打印 WxPusher 返回的真实结果，如果是报错，这里能看到！
                          print('WxPusher 返回结果:', push_resp.read().decode('utf-8'))
                  else:
                      print('还没开门。')
          except Exception as e:
              print('网络错误或代码报错:', e)
          "
