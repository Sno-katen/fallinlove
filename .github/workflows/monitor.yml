name: DC Monitor
on:
  # 👇 这里设了三个错开的闹钟，防止 GitHub 免费版偷懒
  schedule:
    - cron: '*/5 * * * *'     # 每 5 分钟触发一次
    - cron: '1-59/5 * * * *'  # 错开 1 分钟触发
    - cron: '2-59/5 * * * *'  # 错开 2 分钟触发
  workflow_dispatch:          # 允许你在网页上手动点击运行测试

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Run Script
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          INVITE_CODE: "puppyboo"
        run: |
          python -c "
          import os, urllib.request, json
          
          code = os.environ['INVITE_CODE']
          spt = os.environ['WXPUSHER_SPT']
          webhook_url = os.environ['DISCORD_WEBHOOK']
          
          url = f'https://discord.com/api/v10/invites/{code}?with_counts=true'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  if response.status == 200:
                      print('开门了！开始疯狂报警...')
                      
                      # 准备通知正文（链接已单独换行方便复制）
                      content = f'🔥🔥🔥 wbz！快醒醒！！！社区开门啦！！！ 🔥🔥🔥\n\n🎉 邀请码：{code}\n\n🔗 链接：https://discord.gg/{code}\n\n🏃‍♂️💨 别犹豫了！！！赶紧带上魔法冲进去！！！'
                      
                      # ====== 1. 发送到 Discord 频道 ======
                      try:
                          payload_dc = {'content': '@everyone ' + content}
                          data_dc = json.dumps(payload_dc).encode('utf-8')
                          req_dc = urllib.request.Request(webhook_url, data=data_dc, headers={'Content-Type': 'application/json'})
                          urllib.request.urlopen(req_dc, timeout=10)
                          print('✅ Discord 发送成功！')
                      except Exception as e:
                          print('❌ Discord 发送失败:', e)

                      # ====== 2. 发送到你的微信 ======
                      try:
                          payload_wx = {
                              'spt': spt,
                              'content': content,
                              'summary': '🚨🚨🚨 紧急提醒：wbz！开门啦！快冲！！！ 🚨🚨🚨',
                              'contentType': 1
                          }
                          data_wx = json.dumps(payload_wx).encode('utf-8')
                          req_wx = urllib.request.Request('https://wxpusher.zjiecode.com/api/send/message/simple-push', data=data_wx, headers={'Content-Type': 'application/json'})
                          urllib.request.urlopen(req_wx, timeout=10)
                          print('✅ 微信发送成功！')
                      except Exception as e:
                          print('❌ 微信发送失败:', e)

                  else:
                      print('还没开门，继续等。')
          except Exception as e:
              print('网络错误或获取状态失败:', e)
          "
